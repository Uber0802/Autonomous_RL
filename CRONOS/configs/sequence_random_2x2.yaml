# Sequence random — shuffle all tasks into a permutation, execute in order,
# then reshuffle when done. Each task appears exactly once per cycle.
cronos_version: V0.2
task_order: sequence_random
num_envs: 64

groups:
  - name: "shuffled_2x2"
    obj: [7, 2]
    recep: [1, 2]
    task_sequence:
      - "put obj1 on recep1"
      - "put obj1 on recep2"
      - "put obj2 on recep1"
      - "put obj2 on recep2"
    # Each cycle (4 segments) covers all 4 tasks in random order.
    # Segment 5+: new random permutation.
