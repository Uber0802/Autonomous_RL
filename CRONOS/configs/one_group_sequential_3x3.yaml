# One group, 3 objects x 3 receptacles, sequential task order.
# 9 tasks total, fan-out enabled (default).
#
# Objects: ketchup_bottle (7), kitchen_shovel (2), bread (3)
# Receptacles: yellow_plate (1), cloth (2), blue_plate (3)

cronos_version: V0.3
task_order: sequential
fan_out: true

groups:
  - name: "scene_3x3"
    num_envs: 72             # 72 envs / 9 tasks = 8 envs per task
    obj: [7, 2, 3]           # ketchup_bottle, kitchen_shovel, bread
    recep: [1, 2, 3]         # yellow_plate, cloth, blue_plate
    # task_sequence auto-generated: all 9 NxM combinations
    # eval_tasks auto-generated: same as task_sequence
