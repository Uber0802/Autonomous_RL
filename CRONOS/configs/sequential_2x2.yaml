# Sequential task ordering for 2-object 2-receptacle setup.
# All 4 tasks rotate in order each segment. When exhausted, repeat.
cronos_version: V0.2
task_order: sequential
num_envs: 64

groups:
  - name: "default_2x2"
    obj: [7, 2]              # obj1=ketchup bottle, obj2=kitchen shovel
    recep: [1, 2]            # recep1=yellow plate, recep2=cloth
    task_sequence:
      - "put obj1 on recep1"  # put ketchup bottle on yellow_plate
      - "put obj1 on recep2"  # put ketchup bottle on cloth
      - "put obj2 on recep1"  # put kitchen shovel on yellow_plate
      - "put obj2 on recep2"  # put kitchen shovel on cloth
    # eval_tasks omitted → defaults to all 4 unique tasks in task_sequence
