# One group, 2x2, pure_random task order.
# Each segment: sample a random task (≠ previous), weighted by frequency in task_sequence.
# Fan-out enabled (default).

cronos_version: V0.3
task_order: pure_random
fan_out: true

groups:
  - name: "pure_random"
    num_envs: 64
    obj: [7, 2]              # ketchup_bottle, kitchen_shovel
    recep: [1, 2]            # yellow_plate, cloth
    task_sequence:
      - "put obj1 on recep1"
      - "put obj1 on recep2"
      - "put obj2 on recep1"
      - "put obj2 on recep2"
    eval_tasks:
      - "put obj1 on recep1"
      - "put obj1 on recep2"
      - "put obj2 on recep1"
      - "put obj2 on recep2"
