# Two groups with different objects, receptacles, and background.
# Sequential task order, fan-out enabled (default).
#
# Group A: ketchup_bottle (7) + kitchen_shovel (2) on yellow_plate (1) + cloth (2)
# Group B: bread (3) + 7up_can (5) on newspaper (4) + carpet (3)

cronos_version: V0.3
task_order: sequential
fan_out: true

groups:
  - name: "group_A"
    num_envs: 32
    obj: [7, 2]              # ketchup_bottle, kitchen_shovel
    recep: [1, 2]            # yellow_plate, cloth
    background: 0
    task_sequence:
      - "put obj1 on recep1"
      - "put obj1 on recep2"
      - "put obj2 on recep1"
      - "put obj2 on recep2"

  - name: "group_B"
    num_envs: 32
    obj: [3, 5]              # bread, 7up_can
    recep: [4, 3]            # newspaper, carpet
    background: 1
    task_sequence:
      - "put obj1 on recep1"
      - "put obj1 on recep2"
      - "put obj2 on recep1"
      - "put obj2 on recep2"
